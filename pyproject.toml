[project]
name = "mcd"
version = "0.1.0"
description = "Motor Claim Data Pipeline and Schema Validator CLI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Washirawish"}
]
dependencies = [] #pandas requests pip (any 3rd party package)

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
dev = [
    "pytest>=7.0"
]

[project.scripts]
mcd = "mcd:main"

[project.urls]
Repository = "https://github.com/washirawish0418224/Python_Project2_MCD"

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["src"]